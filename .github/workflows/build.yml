name: Native builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libayatana-appindicator3-dev xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .CyDocBuild/package-lock.json
      - run: npm ci --prefix .CyDocBuild
      - run: npm test --prefix .CyDocBuild
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Install verified WireGuard on disposable Windows runner
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_wireguard_ci.ps1 -DisposableHost
      - name: Real Windows WireGuardNT and service ownership
        if: runner.os == 'Windows'
        run: python tests/wireguard_windows.py --disposable-host --cli build/Release/cysynck.exe --direct-probe build/Release/cysynck-windows-direct-socket-tests.exe --work "${{ runner.temp }}/cysynck-wg-win-${{ github.run_id }}-${{ github.run_attempt }}" --report build/network-report/wireguard-windows.json
      - name: Install official macOS WireGuard tools on disposable runner
        if: runner.os == 'macOS'
        run: brew install wireguard-tools wireguard-go
      - name: Real macOS WireGuard and unprivileged interface binding
        if: runner.os == 'macOS'
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true python3 tests/wireguard_macos.py --disposable-host --cli "$GITHUB_WORKSPACE/build/cysynck" --direct-probe "$GITHUB_WORKSPACE/build/cysynck-macos-direct-socket-tests" --work "$RUNNER_TEMP/cysynck-wg-mac-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --report "$GITHUB_WORKSPACE/build/network-report/wireguard-macos.json"
      - name: Test
        run: ctest --test-dir build -C Release --parallel 2 --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix dist
      - name: Test Windows deployment without system integration
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/deployment_tests.ps1 -Package dist
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist/packages
      - name: Run packaged CLI and SDK on Windows
        if: runner.os == 'Windows'
        run: cmake -DPACKAGE_DIR="${{ github.workspace }}/dist/packages" -DWORK_DIR="${{ github.workspace }}/package-smoke" -P tests/package_smoke.cmake
      - name: Run packaged CLI, SDK and Linux desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a cmake -DPACKAGE_DIR="${{ github.workspace }}/dist/packages" -DWORK_DIR="${{ github.workspace }}/package-smoke" -DDESKTOP_SMOKE=ON -P tests/package_smoke.cmake
      - name: Run packaged CLI, SDK and relocated macOS app
        if: runner.os == 'macOS'
        run: cmake -DPACKAGE_DIR="${{ github.workspace }}/dist/packages" -DWORK_DIR="${{ github.workspace }}/package-smoke" -DDESKTOP_SMOKE=ON -P tests/package_smoke.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CySynck-diagnostics-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: ignore
          path: |
            build/Testing/Temporary/LastTest.log
            build/network-report/
            package-smoke/desktop-*.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: CySynck-${{ runner.os }}-${{ runner.arch }}
          path: dist/packages/
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends syncthing wireguard-tools iproute2 iputils-ping openssl miniupnpd-iptables iptables
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .CyDocBuild/package-lock.json
      - run: npm ci --prefix .CyDocBuild
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCYSYNCK_DESKTOP=OFF -DCYSYNCK_TEST_SYNCTHING=/usr/bin/syncthing
      - name: Build the headless CLI for real network validation
        run: cmake --build build --target cysynck cysynck-linux-direct-socket-tests --parallel 3
      - name: Real Linux kernel WireGuard in isolated network namespaces
        run: sudo python3 tests/wireguard_integration.py --prepare-apparmor --cli "$GITHUB_WORKSPACE/build/cysynck" --direct-probe "$GITHUB_WORKSPACE/build/cysynck-linux-direct-socket-tests" --work "$RUNNER_TEMP/cysynck-wg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --report "$GITHUB_WORKSPACE/build/network-report/wireguard.json"
      - name: Real PCP and NAT-PMP routers with kernel WireGuard
        run: sudo python3 tests/router_wireguard_integration.py --prepare-apparmor --cli "$GITHUB_WORKSPACE/build/cysynck" --work "$RUNNER_TEMP/cysynck-wg-nat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --report "$GITHUB_WORKSPACE/build/network-report/router-wireguard.json"
      - name: Build all remaining C++ test and SDK targets
        run: cmake --build build --parallel 3
      - run: ctest --test-dir build --parallel 2 --output-on-failure
      - run: cpack --config build/CPackConfig.cmake -B dist/packages
      - run: cmake -DPACKAGE_DIR="${{ github.workspace }}/dist/packages" -DWORK_DIR="${{ github.workspace }}/package-smoke" -P tests/package_smoke.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CySynck-Linux-network-report-${{ runner.arch }}
          if-no-files-found: ignore
          path: build/network-report/
      - uses: actions/upload-artifact@v4
        with:
          name: CySynck-Linux-server-${{ runner.arch }}
          path: dist/packages/
