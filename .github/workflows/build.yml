name: Native builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libayatana-appindicator3-dev xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .CyDocBuild/package-lock.json
      - run: npm ci --prefix .CyDocBuild
      - run: npm test --prefix .CyDocBuild
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix dist
      - name: Test Windows deployment without system integration
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/deployment_tests.ps1 -Package dist
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist/packages
      - name: Run packaged CLI and SDK on Windows
        if: runner.os == 'Windows'
        run: cmake -DPACKAGE_DIR="${{ github.workspace }}/dist/packages" -DWORK_DIR="${{ github.workspace }}/package-smoke" -P tests/package_smoke.cmake
      - name: Run packaged CLI, SDK and Linux desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a cmake -DPACKAGE_DIR="${{ github.workspace }}/dist/packages" -DWORK_DIR="${{ github.workspace }}/package-smoke" -DDESKTOP_SMOKE=ON -P tests/package_smoke.cmake
      - name: Run packaged CLI, SDK and relocated macOS app
        if: runner.os == 'macOS'
        run: cmake -DPACKAGE_DIR="${{ github.workspace }}/dist/packages" -DWORK_DIR="${{ github.workspace }}/package-smoke" -DDESKTOP_SMOKE=ON -P tests/package_smoke.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: CySynck-${{ runner.os }}-${{ runner.arch }}
          path: dist/packages/
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y syncthing
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .CyDocBuild/package-lock.json
      - run: npm ci --prefix .CyDocBuild
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCYSYNCK_DESKTOP=OFF -DCYSYNCK_TEST_SYNCTHING=/usr/bin/syncthing
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - run: cpack --config build/CPackConfig.cmake -B dist/packages
      - run: cmake -DPACKAGE_DIR="${{ github.workspace }}/dist/packages" -DWORK_DIR="${{ github.workspace }}/package-smoke" -P tests/package_smoke.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: CySynck-Linux-server-${{ runner.arch }}
          path: dist/packages/
